<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng sinh nhật người đẹp 🎂</title>
<!-- Ảnh hiện ra khi gửi link (Messenger, Zalo, Facebook...).
     Thay USERNAME và REPO bằng tên GitHub và tên repo của bạn ở 2 dòng og:url và og:image. -->
<meta name="description" content="Bấm vào để thổi nến nhé.">
<meta property="og:type" content="website">
<meta property="og:title" content="Chúc mừng sinh nhật người đẹp 🎂">
<meta property="og:description" content="Bấm vào để thổi nến nhé.">
<meta property="og:url" content="https://USERNAME.github.io/REPO/">
<meta property="og:image" content="https://hieugiaosu.github.io/birthday/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0E1433">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
  /* Trang là bầu trời đêm nên giữ một bảng màu tối cho cả hai chế độ sáng/tối */
  :root {
    --sky-top: #0E1433;
    --sky-bottom: #2A1E5C;
    --ink: #E8EBFF;
    --ink-soft: #A9AEDB;
    --blue: #8EA8FF;
    --lavender: #C6B3FF;
    --star: #FFF6D8;
    --flame: #F6C35B;
    --glass: rgba(232, 235, 255, .06);
    --line: rgba(198, 179, 255, .28);
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-behavior: smooth; background: var(--sky-top); }
  body {
    margin: 0; color: var(--ink); overflow-x: hidden; min-height: 100svh;
    background: linear-gradient(180deg, var(--sky-top) 0%, #1A1A48 45%, var(--sky-bottom) 100%);
    font: 300 1.0625rem/1.7 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .display { font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 200; letter-spacing: -.02em; }
  button {
    font: inherit; font-weight: 400; cursor: pointer; border: 0; border-radius: 999px;
    padding: .7rem 1.6rem; background: var(--blue); color: #0E1433;
  }
  button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button:focus-visible, .candle:focus-visible, .star:focus-visible { outline: 2px solid var(--lavender); outline-offset: 4px; }

  #sky-bg, #fx { position: fixed; inset: 0; pointer-events: none; }
  #sky-bg { z-index: 0; height: 100lvh; }
  #fx { z-index: 50; }
  header, main, footer { position: relative; z-index: 1; }

  /* ---------- Màn 1: bánh ---------- */
  .hero {
    min-height: 100svh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1.5rem; padding: 2rem 1.25rem; text-align: center;
  }
  .hero h1 {
    margin: 0; font-size: clamp(2.1rem, 8.5vw, 4.4rem); line-height: 1.25; max-width: 15ch;
    padding-top: .15em; text-wrap: balance;
  }
  .hero h1 .w { display: inline-block; white-space: nowrap; }
  .hero h1 .ch { display: inline-block; animation: rise .9s cubic-bezier(.2,.9,.3,1) both; animation-delay: calc(var(--i) * 40ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(.5em); filter: blur(6px); } }
  .wish { margin: 0; color: var(--ink-soft); }

  .cake { position: relative; width: min(260px, 74vw); margin-top: 4.5rem; }
  body.celebrated .cake { animation: settle .9s cubic-bezier(.3,1.5,.5,1); }
  @keyframes settle { 40% { transform: scale(1.06, .94); } 70% { transform: scale(.98, 1.02); } }
  .candles {
    position: absolute; left: 0; right: 0; top: -58px;
    display: flex; justify-content: center; gap: clamp(10px, 4vw, 22px);
  }
  .candle {
    position: relative; width: 11px; height: 52px; padding: 0; border-radius: 3px;
    background: repeating-linear-gradient(-45deg, #fff 0 6px, var(--blue) 6px 12px);
  }
  .candle::before {
    content: ""; position: absolute; left: 50%; top: -7px; width: 2px; height: 8px;
    background: #3A3260; transform: translateX(-50%);
  }
  .flame {
    position: absolute; left: 50%; top: -34px; width: 16px; height: 26px; margin-left: -8px;
    border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%;
    background: radial-gradient(ellipse at 50% 75%, #fff 0 18%, var(--flame) 45%, #E8742C 85%);
    box-shadow: 0 0 22px 8px rgba(246, 195, 91, .45); transform-origin: 50% 90%;
    animation: flicker 1.2s ease-in-out infinite alternate; transition: opacity .3s, transform .3s;
  }
  .candle.out .flame { opacity: 0; transform: scale(.2) translateY(10px); animation: none; }
  .smoke {
    position: absolute; left: 50%; top: -20px; width: 8px; height: 8px; margin-left: -4px;
    border-radius: 50%; background: var(--ink-soft); opacity: 0; pointer-events: none;
  }
  .candle.out .smoke { animation: smoke 1.4s ease-out forwards; }
  @keyframes flicker {
    0% { transform: rotate(-3deg); } 50% { transform: rotate(2deg) scaleY(1.08); } 100% { transform: rotate(-1deg) scaleY(.95); }
  }
  @keyframes smoke { 0% { opacity: .5; } 100% { opacity: 0; transform: translateY(-50px) scale(3); } }
  .tier { position: relative; margin: 0 auto; }
  .tier.top { width: 74%; height: 66px; background: #9C8CE8; border-radius: 12px 12px 4px 4px; }
  .tier.top::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 24px; border-radius: 12px 12px 0 0;
    background:
      radial-gradient(circle at 10px 14px, #F2F0FF 9px, transparent 10px) 0 0 / 26px 28px repeat-x,
      linear-gradient(#F2F0FF, #F2F0FF) 0 0 / 100% 11px no-repeat;
  }
  .tier.bottom { width: 100%; height: 88px; background: #34408C; border-radius: 10px 10px 8px 8px; margin-top: -2px; }
  .tier.bottom::before {
    content: ""; position: absolute; inset: 22px 12px auto; height: 40px;
    background: radial-gradient(circle, rgba(255,246,216,.9) 1.5px, transparent 2px) 0 0 / 22px 20px;
  }
  .plate { width: 114%; margin-left: -7%; height: 14px; border-radius: 50%; background: rgba(232,235,255,.18); }
  .hint { font-size: .9rem; color: var(--ink-soft); margin: -.5rem 0 0; }
  .scroll-cue { color: var(--ink-soft); text-decoration: none; font-size: .95rem; }

  .after { display: none; }
  body.celebrated .after { display: block; }
  body.celebrated .before-only { display: none; }

  /* ---------- Thiệp: lời chúc + sáu ngôi sao ---------- */
  .card-section { padding: 4rem 1.25rem 2rem; }
  .card {
    max-width: 680px; margin: 0 auto; padding: 2.25rem clamp(1.25rem, 5vw, 2.75rem) 2rem;
    background: var(--glass); border: 1px solid var(--line); border-radius: 22px;
  }
  .card h2 { margin: 0 0 1.25rem; font-size: clamp(1.6rem, 5.5vw, 2.3rem); line-height: 1.3; }
  .letter p { margin: 0 0 1rem; min-height: 1.7em; }
  .letter .sign { text-align: right; margin: 1.5rem 0 0; font-size: 1.25rem; color: var(--lavender); }
  .viewer.no-captions h3, .viewer.no-captions p { display: none; }
  .caret::after {
    content: ""; display: inline-block; width: 1px; height: 1em; margin-left: 2px;
    vertical-align: -.1em; background: var(--lavender); animation: blink .8s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .photos { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--line); opacity: 0; transition: opacity .8s; }
  .photos.shown { opacity: 1; }
  .photos .lead { margin: 0; text-align: center; color: var(--ink-soft); font-size: .95rem; min-height: 1.7em; transition: color .4s, font-size .4s; }
  .photos .lead.wish-now {
    color: var(--star); font-size: clamp(1rem, 4.4vw, 1.15rem); font-weight: 400; text-wrap: balance;
    animation: glow 1.1s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { opacity: 1; text-shadow: 0 0 6px rgba(255,246,216,.9), 0 0 22px rgba(198,179,255,.8); }
    50%      { opacity: .35; text-shadow: none; }
  }

  /* khung ảnh mở ra phía trên chòm sao */
  .viewer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .55s cubic-bezier(.2,.8,.2,1); }
  .viewer.open { grid-template-rows: 1fr; }
  .viewer > .inner { overflow: hidden; min-height: 0; }
  .frame {
    position: relative; height: min(46svh, 440px); margin-top: 1.25rem;
    display: grid; place-items: center; border-radius: 14px; background: rgba(14, 20, 51, .55);
  }
  .frame img {
    max-width: 100%; max-height: min(46svh, 440px); object-fit: contain; border-radius: 10px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .4); transition: opacity .3s;
  }
  .frame img.loading { opacity: 0; }
  .frame .status { position: absolute; inset: 0; display: grid; place-items: center; padding: 1rem; text-align: center; color: var(--ink-soft); font-size: .9rem; }
  .frame .status[hidden] { display: none; }
  .viewer h3 { margin: 1rem 0 .2rem; font-size: clamp(1.3rem, 5vw, 1.6rem); line-height: 1.3; }
  .viewer p { margin: 0; color: var(--ink-soft); min-height: 1.7em; }

  .constellation { position: relative; margin: 1rem 0 0; aspect-ratio: 3 / 1; }
  @media (max-width: 600px) { .constellation { aspect-ratio: 5 / 2; } }
  .constellation svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .constellation line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke .8s; }
  .constellation.drawn line { animation: draw 1.2s ease-out forwards; animation-delay: calc(var(--d) * 180ms + 500ms); }
  .constellation.complete line { stroke: rgba(198, 179, 255, .8); }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .star {
    position: absolute; width: 52px; height: 52px; margin: -26px 0 0 -26px; padding: 0;
    background: transparent; border-radius: 50%; display: grid; place-items: center;
    opacity: 0; transform: scale(.3);
  }
  .constellation.drawn .star { animation: appear .8s cubic-bezier(.2,1.4,.4,1) forwards; animation-delay: calc(var(--d) * 180ms); }
  @keyframes appear { to { opacity: 1; transform: scale(1); } }
  .star .core {
    position: relative; width: 11px; height: 11px; border-radius: 50%; background: var(--star);
    box-shadow: 0 0 10px 3px rgba(255, 246, 216, .8), 0 0 30px 9px rgba(142, 168, 255, .45);
    animation: twinkle 2.6s ease-in-out infinite; animation-delay: calc(var(--d) * -.4s);
    transition: transform .3s, background .4s;
  }
  .star .core::before, .star .core::after {
    content: ""; position: absolute; left: 50%; top: 50%; background: rgba(255, 246, 216, .7);
    transform: translate(-50%, -50%); border-radius: 2px;
  }
  .star .core::before { width: 30px; height: 1.5px; }
  .star .core::after { width: 1.5px; height: 30px; }
  @media (hover: hover) { .star:hover .core { transform: scale(1.35); } }
  .star.seen .core { background: var(--lavender); box-shadow: 0 0 8px 2px rgba(198,179,255,.7), 0 0 24px 8px rgba(198,179,255,.3); }
  .star.active .core { transform: scale(1.5); }
  .star.next::after { /* vòng gợi ý ngôi sao tiếp theo */
    content: ""; position: absolute; inset: 8px; border-radius: 50%;
    border: 1px solid rgba(255, 246, 216, .6); animation: ping 1.8s ease-out infinite;
  }
  @keyframes twinkle { 50% { transform: scale(.78); opacity: .75; } }
  @keyframes ping { from { transform: scale(.5); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }

  footer { text-align: center; padding: 2rem 1rem 4rem; color: var(--ink-soft); }
  .music-btn { position: fixed; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 40; padding: .55rem .85rem; background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink-soft); }

  @media (max-width: 600px) { .card-section { padding: 3rem 1rem 1.5rem; } }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .flame, .caret::after, .hero h1 .ch, body.celebrated .cake, .star .core, .star.next::after, .photos .lead.wish-now { animation: none; }
    .constellation.drawn line { animation: none; stroke-dashoffset: 0; }
    .constellation.drawn .star { animation: none; opacity: 1; transform: none; }
    .viewer { transition: none; }
  }
</style>
</head>
<body>

<canvas id="sky-bg" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="hero">
  <h1 class="display" id="title">Hôm nay là sinh nhật ai đó</h1>
  <p class="wish before-only">Ước một điều rồi thổi nến.</p>

  <div class="cake" aria-label="Bánh sinh nhật">
    <div class="candles" id="candles"></div>
    <div class="tier top"></div>
    <div class="tier bottom"></div>
    <div class="plate"></div>
  </div>

  <button class="before-only" id="blowBtn">Thổi nến</button>
  <p class="hint before-only">Hoặc chạm vào từng ngọn nến.</p>
  <a class="scroll-cue after" href="#card">Kéo xuống ↓</a>
</header>

<main class="after">
  <section class="card-section" id="card">
    <div class="card">
      <h2 class="display" id="greeting"></h2>
      <div class="letter" id="letterBox" aria-live="polite"></div>

      <div class="photos" id="photos">
        <p class="lead" id="lead">Các vì sao kia, bấm vào từng cái để ước thôi.</p>
        <div class="viewer" id="viewer" aria-live="polite">
          <div class="inner">
            <div class="frame" id="frame">
              <span class="status" id="status"></span>
              <img id="photoImg" alt="">
            </div>
            <h3 class="display" id="photoTitle"></h3>
            <p id="photoNote"></p>
          </div>
        </div>
        <div class="constellation" id="constellation">
          <svg aria-hidden="true" id="lines"></svg>
        </div>
      </div>
    </div>
  </section>

  <footer>Tuổi mới vui nhé.</footer>
</main>

<button class="music-btn" id="musicBtn" hidden aria-label="Bật nhạc">♪</button>
<audio id="music" loop></audio>

<script>
/* =========================================================
   SỬA Ở ĐÂY LÀ ĐỦ — mọi nội dung của trang nằm trong CONFIG
   ========================================================= */
const CONFIG = {
  name: "Khánh Giang",
  candles: 5,
  greeting: "Gửi nhà bác học đại tài,",
  letter: [
    "Hello người yêu anh ở tuổi 23. Chúc em tuổi mới, khám phá được nhiều thứ mới hơn, làm điều em thích, sống vì thứ em đam mê, bản thân phải xinh đẹp và rực rỡ hơn nha. Anh rất là rất là yêu em đó."
  ],
  signature: "Happy Birthday, I love you.",
  typingSpeed: 16,        // ms mỗi chữ, càng nhỏ càng nhanh
  showCaptions: false,    // true để hiện tiêu đề + nội dung từng ảnh
  /* Mỗi ngôi sao là một ảnh. Sửa title và note thành chuyện của tấm đó. */
  photos: [
    { src: "https://drive.google.com/file/d/1S6BOvmx_5Lq2x9q2Lndz8mqCQZE6JSk1/view?usp=drive_link",
      title: "Tấm thứ nhất", note: "Viết vài dòng về tấm này." },
    { src: "https://drive.google.com/file/d/1ce7GEjXa3hw-itpuRGB2gUR1t8pnusvJ/view?usp=drive_link",
      title: "Tấm thứ hai", note: "Viết vài dòng về tấm này." },
    { src: "https://drive.google.com/file/d/1TbxG34zIJexcnHzh19bf6OETwarQvDM-/view?usp=drive_link",
      title: "Tấm thứ ba", note: "Viết vài dòng về tấm này." },
    { src: "https://drive.google.com/file/d/1Vm8rhw4XWTShe1RHLPnXLyDNBxwS5S51/view?usp=drive_link",
      title: "Tấm thứ tư", note: "Viết vài dòng về tấm này." },
    { src: "https://drive.google.com/file/d/1kuOcn68bzOgEU8ZBEASBjR1QLQFaSxId/view?usp=drive_link",
      title: "Tấm thứ năm", note: "Viết vài dòng về tấm này." },
    { src: "https://drive.google.com/file/d/1nM4E6jBSTrFOaKYEGv7HLWry6bqllhhH/view?usp=drive_link",
      title: "Tấm thứ sáu", note: "Viết vài dòng về tấm này." }
  ],
  music: ""   // ví dụ "music.mp3"
};

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Link ảnh: file trong repo hoặc link Drive ---------- */
function photoSources(src) {
  const m = src.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]{20,})/);
  if (!m) return [src];
  return [
    `https://lh3.googleusercontent.com/d/${m[1]}=w1600`,
    `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1600`
  ];
}
const photos = CONFIG.photos.map(p => ({ ...p, sources: photoSources(p.src), good: null }));

/* ---------- Bầu trời nền ---------- */
(function skyBackground() {
  const cv = document.getElementById("sky-bg"), g = cv.getContext("2d");
  let W, H, stars = [], shoot = null, nextShoot = 3000;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const h = Math.max(innerHeight, screen.height || 0);
    if (W === innerWidth && H >= h) return;   // bỏ qua khi thanh địa chỉ co giãn
    W = innerWidth; H = h;
    cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.round(W * H / 5000) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.1 + .2,
      a: Math.random() * .6 + .2, s: Math.random() * 2 + .5, p: Math.random() * 6
    }));
    if (reduceMotion) draw(0);
  }
  function draw(t) {
    g.clearRect(0, 0, W, H);
    for (const s of stars) {
      g.globalAlpha = reduceMotion ? s.a : s.a * (.6 + .4 * Math.sin(t / 1000 * s.s + s.p));
      g.fillStyle = "#E8EBFF";
      g.beginPath(); g.arc(s.x, s.y, s.r, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
    if (reduceMotion) return;
    if (!shoot && t > nextShoot) {
      shoot = { x: Math.random() * W * .7 + W * .2, y: Math.random() * H * .3, life: 1 };
      nextShoot = t + 5000 + Math.random() * 6000;
    }
    if (shoot) {
      shoot.x -= 9; shoot.y += 4; shoot.life -= .02;
      const grad = g.createLinearGradient(shoot.x, shoot.y, shoot.x + 90, shoot.y - 40);
      grad.addColorStop(0, `rgba(232,235,255,${shoot.life})`); grad.addColorStop(1, "rgba(232,235,255,0)");
      g.strokeStyle = grad; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(shoot.x, shoot.y); g.lineTo(shoot.x + 90, shoot.y - 40); g.stroke();
      if (shoot.life <= 0) shoot = null;
    }
    requestAnimationFrame(draw);
  }
  addEventListener("resize", resize);
  resize();
  if (!reduceMotion) requestAnimationFrame(draw);
})();

/* ---------- Bánh & nến ---------- */
const candlesEl = document.getElementById("candles");
let litCount = CONFIG.candles;
for (let i = 0; i < CONFIG.candles; i++) {
  const c = document.createElement("button");
  c.className = "candle";
  c.setAttribute("aria-label", `Thổi nến số ${i + 1}`);
  c.innerHTML = '<span class="flame"></span><span class="smoke"></span>';
  c.addEventListener("click", () => blow(c));
  candlesEl.appendChild(c);
}
function blow(candle) {
  if (candle.classList.contains("out")) return;
  candle.classList.add("out");
  candle.setAttribute("aria-label", "Nến đã tắt");
  if (--litCount === 0) setTimeout(celebrate, 500);
}
document.getElementById("blowBtn").addEventListener("click", () => {
  [...candlesEl.children].forEach((c, i) => setTimeout(() => blow(c), i * 150));
});

/* ---------- Khi thổi xong ---------- */
function celebrate() {
  document.body.classList.add("celebrated");
  animateTitle(`Chúc mừng sinh nhật, ${CONFIG.name}`);
  fireworks();
  setupMusic();
  setupConstellation();
  setupLetter();
  photos.forEach(preload);
}

function animateTitle(text) {
  const h = document.getElementById("title");
  h.textContent = ""; h.setAttribute("aria-label", text);
  const split = t => window.Intl && Intl.Segmenter
    ? [...new Intl.Segmenter("vi", { granularity: "grapheme" }).segment(t)].map(x => x.segment)
    : Array.from(t);
  let i = 0;
  text.split(" ").forEach((word, wi) => {
    if (wi > 0) h.appendChild(document.createTextNode(" "));
    const w = document.createElement("span");
    w.className = "w"; w.setAttribute("aria-hidden", "true");
    split(word).forEach(ch => {
      const c = document.createElement("span");
      c.className = "ch"; c.style.setProperty("--i", i++); c.textContent = ch;
      w.appendChild(c);
    });
    h.appendChild(w);
  });
}

/* ---------- Canvas hiệu ứng: pháo hoa & mưa sao ---------- */
function fxCanvas() {
  const cv = document.getElementById("fx"), g = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, W, H };
}

function fireworks() {
  if (reduceMotion) return;
  const { g, W, H } = fxCanvas();
  const colors = ["#8EA8FF", "#C6B3FF", "#E8EBFF", "#9FE7FF", "#FFF6D8"];
  const pick = () => colors[Math.floor(Math.random() * colors.length)];
  const parts = [];
  const burst = (x, y) => {
    const c = pick(), c2 = pick(), n = 70;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, sp = 2 + Math.random() * 3.8;
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, c: i % 3 ? c : c2, life: 1, r: 1.6 + Math.random() });
    }
  };
  [0, 350, 800, 1250, 1700, 2300].forEach(d => setTimeout(() =>
    burst(W * (.12 + Math.random() * .76), H * (.1 + Math.random() * .32)), d));
  const start = performance.now();
  (function frame(t) {
    g.clearRect(0, 0, W, H);
    for (const p of parts) {
      if (p.life <= 0) continue;
      p.vy += .04; p.vx *= .975; p.vy *= .975; p.x += p.vx; p.y += p.vy; p.life -= .011;
      g.globalAlpha = Math.max(p.life, 0); g.fillStyle = p.c;
      g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
    if (t - start < 5200) requestAnimationFrame(frame);
    else g.clearRect(0, 0, W, H);
  })(start);
}

function meteorShower() {
  if (reduceMotion) return;
  const { g, W, H } = fxCanvas();
  const n = Math.round(Math.min(120, 60 + W / 18));
  const colors = ["255,246,216", "232,235,255", "198,179,255", "142,168,255", "159,231,255"];
  const meteors = Array.from({ length: n }, () => {
    const speed = 11 + Math.random() * 9;
    return {
      x: Math.random() * W * 1.4, y: -60 - Math.random() * H * .3,
      vx: -speed * .55, vy: speed, len: 140 + Math.random() * 160,
      delay: Math.random() * 3000, w: 1.4 + Math.random() * 1.8,
      c: colors[Math.floor(Math.random() * colors.length)]
    };
  });
  const start = performance.now(), DURATION = 8000;
  (function frame(t) {
    const el = t - start;
    const fade = el > DURATION - 600 ? Math.max(0, (DURATION - el) / 600) : 1;  // tắt dần cuối cùng
    g.clearRect(0, 0, W, H);
    g.lineCap = "round";
    for (const m of meteors) {
      if (el < m.delay || m.y - m.len > H) continue;
      m.x += m.vx; m.y += m.vy;
      const k = m.len / Math.hypot(m.vx, m.vy);
      const tx = m.x - m.vx * k, ty = m.y - m.vy * k;
      const grad = g.createLinearGradient(m.x, m.y, tx, ty);
      grad.addColorStop(0, `rgba(${m.c},${fade})`);
      grad.addColorStop(.25, `rgba(${m.c},${.55 * fade})`);
      grad.addColorStop(1, `rgba(${m.c},0)`);
      g.shadowColor = `rgba(${m.c},${.9 * fade})`; g.shadowBlur = 14;
      g.strokeStyle = grad; g.lineWidth = m.w;
      g.beginPath(); g.moveTo(m.x, m.y); g.lineTo(tx, ty); g.stroke();
      g.shadowBlur = 22; g.fillStyle = `rgba(255,255,255,${fade})`;
      g.beginPath(); g.arc(m.x, m.y, m.w * 1.3, 0, Math.PI * 2); g.fill();
    }
    g.shadowBlur = 0;
    if (el < DURATION) requestAnimationFrame(frame);
    else g.clearRect(0, 0, W, H);
  })(start);
}

function setupMusic() {
  if (!CONFIG.music) return;
  const audio = document.getElementById("music"), btn = document.getElementById("musicBtn");
  audio.src = CONFIG.music; btn.hidden = false;
  const sync = () => { btn.textContent = audio.paused ? "♪" : "❚❚"; btn.setAttribute("aria-label", audio.paused ? "Bật nhạc" : "Tắt nhạc"); };
  audio.play().then(sync).catch(sync);
  btn.onclick = () => { audio.paused ? audio.play() : audio.pause(); setTimeout(sync, 50); };
}

/* ---------- Tải ảnh (thử lần lượt từng nguồn) ---------- */
function preload(p) {
  if (p.loading) return p.loading;
  p.loading = new Promise(resolve => {
    let k = 0;
    const tryNext = () => {
      if (k >= p.sources.length) { p.good = false; return resolve(false); }
      const img = new Image();
      img.referrerPolicy = "no-referrer";
      img.onload = () => { p.good = img.src; resolve(true); };
      img.onerror = () => { k++; tryNext(); };
      img.src = p.sources[k];
    };
    tryNext();
  });
  return p.loading;
}

/* ---------- Lời chúc (gõ từng chữ), xong thì hiện sao ---------- */
function setupLetter() {
  document.getElementById("greeting").textContent = CONFIG.greeting;
  if (!CONFIG.showCaptions) document.getElementById("viewer").classList.add("no-captions");
  const box = document.getElementById("letterBox");
  const paras = CONFIG.letter.map(() => box.appendChild(document.createElement("p")));
  const sign = box.appendChild(document.createElement("p"));
  sign.className = "sign";
  if (reduceMotion) {
    CONFIG.letter.forEach((t, i) => paras[i].textContent = t);
    sign.textContent = CONFIG.signature;
    return revealStars();
  }
  const io = new IntersectionObserver(async entries => {
    if (!entries[0].isIntersecting) return;
    io.disconnect();
    for (let i = 0; i < paras.length; i++) {
      paras[i].classList.add("caret");
      for (const ch of CONFIG.letter[i]) {
        paras[i].textContent += ch;
        await wait(ch === "," || ch === "." ? CONFIG.typingSpeed * 5 : CONFIG.typingSpeed);
      }
      paras[i].classList.remove("caret");
      await wait(150);
    }
    sign.textContent = CONFIG.signature;
    await wait(400);
    revealStars();
  }, { threshold: .3 });
  io.observe(box);
}

/* ---------- Sáu ngôi sao ---------- */
const POS = [[8, 64], [24, 28], [41, 60], [58, 24], [75, 62], [92, 32]];  // [x%, y%]
const seen = new Set();
let stars = [], current = -1, showerDone = false;

function setupConstellation() {
  const box = document.getElementById("constellation");
  const svg = document.getElementById("lines");
  stars = photos.map((p, i) => {
    const [x, y] = POS[i % POS.length];
    const b = document.createElement("button");
    b.className = "star" + (i === 0 ? " next" : "");
    b.style.setProperty("--d", i);
    b.style.left = x + "%"; b.style.top = y + "%";
    b.setAttribute("aria-label", `Ngôi sao ${i + 1}: xem ảnh ${p.title}`);
    b.innerHTML = '<span class="core"></span>';
    b.addEventListener("click", () => showPhoto(i));
    box.appendChild(b);
    if (i > 0) {
      const [x1, y1] = POS[(i - 1) % POS.length];
      const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
      Object.entries({ x1: x1 + "%", y1: y1 + "%", x2: x + "%", y2: y + "%", pathLength: 1 })
        .forEach(([k, v]) => l.setAttribute(k, v));
      l.style.setProperty("--d", i - 1);
      svg.appendChild(l);
    }
    return b;
  });
}

function revealStars() {
  document.getElementById("photos").classList.add("shown");
  document.getElementById("constellation").classList.add("drawn");
}

async function showPhoto(i) {
  const p = photos[i], star = stars[i];
  const viewer = document.getElementById("viewer"), img = document.getElementById("photoImg");
  const status = document.getElementById("status"), frame = document.getElementById("frame");
  const firstOpen = !viewer.classList.contains("open");
  current = i;

  stars.forEach(s => s.classList.remove("active"));
  star.classList.add("active", "seen");
  seen.add(i);
  stars.forEach(s => s.classList.remove("next"));
  const nextIdx = photos.findIndex((_, k) => !seen.has(k));
  if (nextIdx > -1) stars[nextIdx].classList.add("next");

  document.getElementById("photoTitle").textContent = p.title;
  document.getElementById("photoNote").textContent = p.note;
  img.alt = p.title;
  img.classList.add("loading");
  status.textContent = "Đang tải ảnh…"; status.hidden = false;
  viewer.classList.add("open");

  const lead = document.getElementById("lead");
  lead.textContent = nextIdx > -1 ? `Ngôi sao ${i + 1} / ${photos.length}` : "Mưa sao băng kìa, em ước đi nào.";
  lead.classList.toggle("wish-now", nextIdx === -1);

  // giữ cả ảnh lẫn chòm sao trong màn hình
  if (firstOpen) setTimeout(() => document.getElementById("photos").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }), 120);

  const ok = await preload(p);
  if (current !== i) return;
  if (ok) {
    img.onload = () => {
      if (current !== i) return;
      img.classList.remove("loading"); status.hidden = true;
      if (!reduceMotion) flyFromStar(img, star);
    };
    img.src = p.good;
    if (img.complete && img.naturalWidth) img.onload();
  } else {
    status.textContent = "Không tải được ảnh này. Kiểm tra quyền chia sẻ trên Drive (Bất kỳ ai có đường liên kết).";
  }

  if (seen.size === photos.length && !showerDone) {
    showerDone = true;
    document.getElementById("constellation").classList.add("complete");
    setTimeout(meteorShower, 900);
  }
}

// ảnh bay ra từ đúng ngôi sao vừa bấm
function flyFromStar(img, star) {
  const a = star.getBoundingClientRect(), b = img.getBoundingClientRect();
  if (!b.width) return;
  const dx = a.left + a.width / 2 - (b.left + b.width / 2);
  const dy = a.top + a.height / 2 - (b.top + b.height / 2);
  img.animate(
    [{ transform: `translate(${dx}px, ${dy}px) scale(.04)`, opacity: 0, borderRadius: "50%" },
     { opacity: 1, offset: .35 },
     { transform: "none", opacity: 1, borderRadius: "10px" }],
    { duration: 560, easing: "cubic-bezier(.2,.85,.25,1)" }
  );
}
